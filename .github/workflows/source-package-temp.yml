name: Source Package Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-package-temp.yml"

jobs:
  package-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: barbershop-desktop-codigo-fonte
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
            !src-tauri/target/**
            !**/*.exe
            !**/*.msi
            !**/*.db
            !**/*.sqlite
            !**/*.sqlite3
          include-hidden-files: true
          if-no-files-found: error
