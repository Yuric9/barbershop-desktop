name: Apply Audit Fix v0.2.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-audit-fix2-temp.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply_audit_fix_v021.py
      - name: Commit corrected source
        run: |
          rm -f TEMP_DO_NOT_USE.txt _probe_ignore.txt _probe_ignore3.txt
          git rm -f .github/workflows/apply-audit-fix-temp.yml || true
          git rm -f .github/workflows/apply-audit-fix2-temp.yml
          git rm -f scripts/apply_audit_fix_v021.py
          git config user.name "Yuri Cesar"
          git config user.email "yure-c@hotmail.com"
          git add -A
          git commit -m "fix: corrige integridade de estoque e prepara v0.2.1"
          git push origin HEAD:main
