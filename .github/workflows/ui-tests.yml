name: Testes da interface

# Roda os testes Playwright (tests/) em todo pull request e push na main.
# O React roda no Vite com um backend falso, então não precisa de Rust nem de Windows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes
        run: npm test

      - name: Guardar relatório se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
