name: Windows Desktop Build

# Push na main / manual: build de teste (artefatos na aba Actions).
# Tag "v*" (ex.: v0.3.0): build oficial assinado para atualização automática + Release público.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # necessário só para publicar o Release nas tags
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        shell: pwsh
        run: npm ci

      - name: Read app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:IS_RELEASE -eq 'true' -and "${{ github.ref_name }}" -ne "v$version") {
            throw "A tag ${{ github.ref_name }} não bate com a versão v$version do tauri.conf.json."
          }

      - name: Generate neutral barbershop icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "src-tauri" | Out-Null
          $bmp = New-Object System.Drawing.Bitmap 1024,1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(17,17,20))
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(242,242,238))
          $silver = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(180,184,190))
          $red = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(187,48,55), 82)
          $blue = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(39,87,143), 82)
          $outline = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(220,220,218), 22)
          $g.FillEllipse($silver, 336, 92, 352, 112)
          $g.FillEllipse($silver, 336, 820, 352, 112)
          $g.FillRectangle($white, 372, 172, 280, 684)
          $g.SetClip((New-Object System.Drawing.Rectangle 384,184,256,660))
          for($x=-420; $x -lt 980; $x+=260){
            $g.DrawLine($red, $x, 860, $x+650, 180)
            $g.DrawLine($blue, $x+125, 860, $x+775, 180)
          }
          $g.ResetClip()
          $g.DrawRectangle($outline, 372,172,280,684)
          $bmp.Save((Join-Path $pwd "src-tauri/app-icon.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $outline.Dispose(); $red.Dispose(); $blue.Dispose(); $white.Dispose(); $silver.Dispose(); $g.Dispose(); $bmp.Dispose()
          npx tauri icon src-tauri/app-icon.png

      - name: TypeScript and Vite build
        shell: pwsh
        run: npm run build

      - name: Rust check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer (teste)
        if: env.IS_RELEASE != 'true'
        shell: pwsh
        run: npx tauri build --bundles nsis

      # Build oficial: assina a atualização com a chave secreta e embute a chave pública no app.
      - name: Build Windows installer (versão oficial, assinada)
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BARBERSHOP_UPDATER_PUBKEY: ${{ vars.BARBERSHOP_UPDATER_PUBKEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:BARBERSHOP_UPDATER_PUBKEY) {
            throw "Configure o segredo TAURI_SIGNING_PRIVATE_KEY e a variável BARBERSHOP_UPDATER_PUBKEY (veja docs/DISTRIBUICAO.md)."
          }
          # A configuração da versão oficial liga os artefatos de atualização e leva a chave pública.
          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:BARBERSHOP_UPDATER_PUBKEY.Trim() } }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 src-tauri/tauri.release.conf.json
          npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Prepare portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/portable | Out-Null
          Copy-Item src-tauri/target/release/barbershop_desktop.exe artifact/portable/GestaoBarbearia.exe
          New-Item -ItemType File -Force -Path artifact/portable/portable.flag | Out-Null
          Copy-Item docs/LEIA-ME.txt artifact/portable/LEIA-ME.txt

      - name: Upload portable EXE
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GestaoBarbearia-v${{ env.APP_VERSION }}-Portable
          path: artifact/portable/
          if-no-files-found: error

      - name: Upload installer EXE
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GestaoBarbearia-v${{ env.APP_VERSION }}-Instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Nomes só com ASCII (o GitHub troca espaços e acentos nos anexos), latest.json para o
      # app se atualizar e SHA256SUMS.txt para quem quiser conferir o download.
      - name: Prepare release files
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $v = $env:APP_VERSION
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $setupName = "GestaoBarbearia_${v}_x64-setup.exe"
          Copy-Item $setup.FullName "release/$setupName"
          $signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
          Compress-Archive -Path artifact/portable/* -DestinationPath "release/GestaoBarbearia_${v}_portatil.zip"
          $latest = [ordered]@{
            version = $v
            notes = "Gestão da Barbearia $v"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$setupName"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release/latest.json
          Get-ChildItem release -File | Where-Object Name -ne "latest.json" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Gestão da Barbearia ${{ github.ref_name }}
          body_path: docs/NOTAS-DA-VERSAO.md
          files: release/*
