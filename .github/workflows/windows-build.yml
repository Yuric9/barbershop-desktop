name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        shell: pwsh
        run: npm install

      - name: Generate neutral barbershop icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "src-tauri" | Out-Null
          $bmp = New-Object System.Drawing.Bitmap 1024,1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(17,17,20))
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(242,242,238))
          $silver = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(180,184,190))
          $red = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(187,48,55), 82)
          $blue = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(39,87,143), 82)
          $outline = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(220,220,218), 22)
          $g.FillEllipse($silver, 336, 92, 352, 112)
          $g.FillEllipse($silver, 336, 820, 352, 112)
          $g.FillRectangle($white, 372, 172, 280, 684)
          $g.SetClip((New-Object System.Drawing.Rectangle 384,184,256,660))
          for($x=-420; $x -lt 980; $x+=260){
            $g.DrawLine($red, $x, 860, $x+650, 180)
            $g.DrawLine($blue, $x+125, 860, $x+775, 180)
          }
          $g.ResetClip()
          $g.DrawRectangle($outline, 372,172,280,684)
          $bmp.Save((Join-Path $pwd "src-tauri/app-icon.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $outline.Dispose(); $red.Dispose(); $blue.Dispose(); $white.Dispose(); $silver.Dispose(); $g.Dispose(); $bmp.Dispose()
          npx tauri icon src-tauri/app-icon.png

      - name: TypeScript and Vite build
        shell: pwsh
        run: npm run build

      - name: Rust check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: pwsh
        run: npx tauri build --bundles nsis

      - name: Prepare portable test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/portable | Out-Null
          Copy-Item src-tauri/target/release/barbershop_desktop.exe artifact/portable/GestaoBarbearia.exe
          New-Item -ItemType File -Force -Path artifact/portable/portable.flag | Out-Null
          @"
          GESTAO DA BARBEARIA - v0.2.0 TESTE

          Execute GestaoBarbearia.exe nesta pasta.
          O arquivo portable.flag mantém os dados em barbershop-data ao lado do programa.
          Faça backup antes de mover, formatar ou substituir o dispositivo.
          "@ | Set-Content -Encoding UTF8 artifact/portable/LEIA-ME.txt

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: GestaoBarbearia-v0.2.0-Portable
          path: artifact/portable/
          if-no-files-found: error

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: GestaoBarbearia-v0.2.0-Instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
